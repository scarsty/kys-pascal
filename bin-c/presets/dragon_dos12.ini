; Append this section to a COPY of Canglong's kysmod.ini.
; Set [system] MODVersion=12 in that file; this always selects DOS rules.
; Remove old remake/legacy or mixed progression/combat selectors.
; Applies to both kys.exe and kys_mcp.exe. Start a new campaign/save lineage.
; Baseline: original installer Z.dat SHA256
; 60ff7e91d7be7a848242e2ddc2ef105b906e160e19f3086bf13ff55d8e951928
; The separate sysEnhance patch is NOT this ruleset.
; Original numbers with documented fixes: docs/苍龙逐日.md.
; The original HP damage fallback formula is intentionally preserved.
[rules]
profile=dragon_dos12
; Compatibility alias for the complete Canglong mod; optional with MODVersion=12.

; Level-up growth only. Battle RNG, proficiency and MP absorption stay unchanged.
; original: DOS batch rolls, including one ability settlement per batch (default).
; fixed_random: per-level rolls fixed by campaign/role/target level; no S/L reroll.
; average: per-level means; carries the shared three-stat half between levels.
; maximum: per-level attainable joint extreme, chosen by growth_max_priority.
growth_mode=original
growth_max_priority=stats
; growth_max_priority: stats or mp (only affects maximum mode).

; Defaults below override inherited [constant] values for this profile.
; Uncomment only when intentionally making a custom variant.
; max_level=30
; max_hp=999
; max_mp=9999
; max_stamina=100
; min_knowledge=80
; life_hurt=10
; poison_hurt=1
; hp_growth_factor=3
; mp_growth_factor=4
; attack_growth_factor=1
; speed_growth_factor=1
; defence_growth_factor=1

; Combat and progression always use DOS 1.2 together.
; To raise the cap above 30, provide cumulative thresholds for all next levels:
; xp_thresholds=50,150,300,... (strictly increasing integers, at most 65535)
