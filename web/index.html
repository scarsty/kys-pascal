<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171914">
  <title>苍龙逐日</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#171914;color:#e8e3d3;font-family:system-ui,sans-serif}
    body{display:flex;flex-direction:column;align-items:center;padding:20px;gap:14px}header{width:min(100%,960px);display:flex;align-items:center;justify-content:space-between}
    h1{font-size:22px;font-weight:500;margin:0;letter-spacing:.18em}button{border:1px solid #77715a;background:#302f24;color:#f4ead0;padding:10px 22px;border-radius:5px;cursor:pointer;font:inherit}
    main{position:relative;width:min(100%,960px);background:#080907;border:1px solid #454638;aspect-ratio:16/11;display:grid;place-items:center}
    canvas{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;outline:none;image-rendering:pixelated;touch-action:none}
    #cover{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:20px;background:#171914}#cover p{margin:0;color:#b9b6a6}
    #status{min-height:22px;font-size:14px;color:#c9be91}footer{font-size:13px;color:#a4a58e;text-align:center;line-height:1.8}
    @media(max-height:650px){body{padding:6px;gap:4px}header{max-width:80vh}h1{font-size:16px}main{max-height:84vh;width:auto;max-width:100%;height:84vh}footer{display:none}}
  </style>
</head>
<body>
  <header><h1>苍龙逐日</h1><button id="fullscreen" type="button">全屏</button></header>
  <main><canvas id="canvas" tabindex="0" width="640" height="440"></canvas><div id="cover"><p>金庸群侠传 · 苍龙逐日</p><button id="start" type="button">开始游戏</button></div></main>
  <div id="status" role="status"></div>
  <footer>方向键移动，回车确认，Esc 返回；也可用鼠标操作。<br>存档保存在当前浏览器中。</footer>
  <script>
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    var Module = {
      canvas,
      setStatus(text) { status.textContent = text; },
      print: console.log,
      printErr: console.error,
      onAbort(reason) { status.textContent = '游戏加载失败，请刷新重试。'; console.error(reason); },
      instantiateWasm(imports, success) {
        (async () => {
          const response = await fetch('kys-dragon.wasm.gz');
          if (!response.ok) throw new Error('游戏程序下载失败');
          const stream = response.body.pipeThrough(new DecompressionStream('gzip'));
          const result = await WebAssembly.instantiateStreaming(new Response(stream, {headers:{'Content-Type':'application/wasm'}}), imports);
          success(result.instance, result.module);
        })().catch(error => { status.textContent = error.message; console.error(error); });
        return {};
      }
    };
    document.getElementById('start').onclick = () => {
      document.getElementById('cover').remove();
      status.textContent = '正在加载游戏…';
      canvas.focus();
      const script = document.createElement('script');
      script.src = 'kys-dragon.js';
      script.onerror = () => { status.textContent = '游戏程序下载失败，请刷新重试。'; };
      document.body.appendChild(script);
    };
    document.getElementById('fullscreen').onclick = () => canvas.requestFullscreen();
    canvas.addEventListener('contextmenu', event => event.preventDefault());
  </script>
</body>
</html>
