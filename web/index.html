<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>苍龙逐日</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#ece8d6;font-family:system-ui,sans-serif}
    #wrap{position:fixed;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000}
    canvas{display:block;outline:none;border:0;background:#000;touch-action:none}
    #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#000;z-index:10;transition:opacity .3s}
    #overlay.hidden{opacity:0;pointer-events:none}h1{margin:0;font-size:24px;font-weight:500;letter-spacing:.2em}
    #spinner{width:36px;height:36px;border:3px solid #333;border-top-color:#b19e78;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}#status{font-size:14px;color:#aaa;text-align:center;line-height:1.7;max-width:85vw}
    progress{width:min(260px,65vw);height:4px;accent-color:#b19e78}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    #toolbar{display:none}.ready #toolbar{display:contents}.float{position:fixed;width:36px;height:36px;border-radius:50%;border:1px solid #ffffff33;background:#0006;color:#aaa;font-size:20px;display:flex;align-items:center;justify-content:center;user-select:none;z-index:5}
    .float:active{background:#ffffff4d}#fullscreen{bottom:max(6px,env(safe-area-inset-bottom));left:max(6px,env(safe-area-inset-left))}#back{bottom:max(6px,env(safe-area-inset-bottom));right:max(6px,env(safe-area-inset-right))}#menu{top:max(6px,env(safe-area-inset-top));right:max(6px,env(safe-area-inset-right))}
    #busy{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:calc(100vw - 100px);padding:8px 14px;border-radius:6px;background:#191716ee;color:#ece8d6;font-size:13px;pointer-events:none;z-index:6;display:flex;align-items:center;gap:9px;white-space:nowrap}
    #busy::before{content:'';flex:none;width:14px;height:14px;border:2px solid #ffffff33;border-top-color:#b19e78;border-radius:50%;animation:spin .8s linear infinite}
    [hidden]{display:none!important}dialog{width:min(400px,calc(100% - 32px));border:1px solid #b19e7860;border-radius:12px;padding:22px;background:#191716;color:#ece8d6;line-height:1.8;touch-action:auto}
    dialog::backdrop{background:#000a}dialog h2{font-size:20px;margin:0 0 16px;font-weight:500}dialog p{font-size:14px;color:#aaa}dialog button{display:block;width:100%;margin:10px 0;padding:10px 14px;background:#302d27;border:1px solid #b19e7840;border-radius:6px;text-align:left}#message{min-height:24px;color:#d5c29b}
    #name-input{width:100%;margin:12px 0;padding:10px;border:1px solid #b19e7860;border-radius:6px;background:#080808;color:#ece8d6;font:20px system-ui;touch-action:auto}#name-dialog label{display:block}
    @media(prefers-reduced-motion:reduce){#overlay{transition:none}#spinner{animation-duration:2s}}
  </style>
</head>
<body>
  <div id="wrap"><canvas id="canvas" width="800" height="450" tabindex="0" aria-label="苍龙逐日游戏画面"></canvas></div>
  <div id="overlay"><h1>苍龙逐日</h1><div id="spinner"></div><progress id="progress" max="1" value="0"></progress><div id="status" role="status">正在准备游戏…</div><button id="retry" hidden>重新加载</button></div>
  <nav id="toolbar" aria-label="网页操作">
  <button class="float" id="back" aria-label="取消或返回" title="取消／返回（Esc）">✕</button>
  <button class="float" id="fullscreen" aria-label="切换画面大小" title="切换画面大小">⛶</button>
  <button class="float" id="menu" aria-label="存档管理" title="存档管理"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 3h13l4 4v14H3V3zM7 3v6h10V3M7 21v-8h10v8"/></svg></button>
  </nav>
  <div id="busy" role="status" hidden></div>
  <dialog id="settings"><h2>存档管理</h2><p>方向键移动，回车确认，Esc 返回。触屏可点右下角取消／返回，左下角切换画面大小。</p><p>请在游戏的系统菜单中存档。这里可以导出备份，或导入其他浏览器的存档。</p><button id="export">导出存档</button><button id="import">导入存档</button><input id="save-file" type="file" accept=".json,application/json" hidden><div id="message" role="status"></div><button id="close">返回游戏</button></dialog>
  <dialog id="name-dialog"><form id="name-form"><h2>请输入主角姓名</h2><label for="name-input">姓名</label><input id="name-input" type="text" maxlength="20" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"><button type="submit">确定</button><button type="button" id="name-cancel">取消</button></form></dialog>
  <script>
    const canvas = document.getElementById('canvas');
    const overlay = document.getElementById('overlay');
    const statusEl = document.getElementById('status');
    const busy = document.getElementById('busy');
    const settings = document.getElementById('settings');
    const nameDialog = document.getElementById('name-dialog');
    const nameInput = document.getElementById('name-input');
    const suppressedKeyUps = new Set();
    const transfers = new Map();
    const mobile = matchMedia('(pointer:coarse)').matches;
    let ready = false, failed = false, expanded = true;
    let gameWidth = 800, gameHeight = 450;
    let lastWidth = 0, lastHeight = 0;
    let loadingLabel = '', awaitingPresentation = false;
    const pendingAssets = new Set();

    function fail(error) {
      failed = true;
      overlay.classList.remove('hidden');
      document.getElementById('spinner').hidden = true;
      document.getElementById('progress').hidden = true;
      document.getElementById('retry').hidden = false;
      statusEl.textContent = '加载失败，请重试。' + (error?.message || '');
      console.error(error);
    }

    function resize() {
      if (nameDialog.open) return;
      const area = document.getElementById('wrap').getBoundingClientRect();
      const scale = Math.min(area.width / gameWidth, area.height / gameHeight, expanded ? Infinity : 1);
      const width = Math.max(1, Math.floor(gameWidth * scale)), height = Math.max(1, Math.floor(gameHeight * scale));
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      if (ready && (width !== lastWidth || height !== lastHeight)) {
        lastWidth = width; lastHeight = height;
        Module.ccall('web_resize', null, ['number','number'], [width,height]);
      }
    }

    var Module = {
      canvas,
      setStatus(text) { if (!ready && !failed && text) statusEl.textContent = '正在准备游戏…'; },
      print: console.log,
      printErr: console.error,
      onAbort: fail,
      hasInteracted: false,
      readSmoothing(fallback) {
        try {
          const saved = localStorage.getItem('kys-dragon.smoothing');
          return saved === 'sharp' ? 0 : saved === 'smooth' ? 2 : fallback;
        } catch (_) { return fallback; }
      },
      readGrowthMode(fallback) {
        try {
          const index = ['original','fixed_random','average','maximum'].indexOf(localStorage.getItem('kys-dragon.growth-mode'));
          return index < 0 ? fallback : index;
        } catch (_) { return fallback; }
      },
      readGrowthPriority(fallback) {
        try {
          const index = ['stats','mp'].indexOf(localStorage.getItem('kys-dragon.growth-priority'));
          return index < 0 ? fallback : index;
        } catch (_) { return fallback; }
      },
      saveGrowthSettings(mode, priority) {
        try {
          localStorage.setItem('kys-dragon.growth-mode',['original','fixed_random','average','maximum'][mode]);
          localStorage.setItem('kys-dragon.growth-priority',['stats','mp'][priority]);
        } catch (_) { }
      },
      saveSmoothing(value) {
        try { localStorage.setItem('kys-dragon.smoothing',value === 0 ? 'sharp' : 'smooth'); } catch (_) {}
      },
      beginLoading(label) {
        loadingLabel = label;
        awaitingPresentation = true;
        updateLoading();
      },
      assetStarted(name, label) { pendingAssets.add(name); Module.beginLoading('正在下载' + label + '…'); },
      assetDecoding(label) { loadingLabel = '正在解压' + label + '…'; updateLoading(); },
      assetFinished(name, label) { pendingAssets.delete(name); loadingLabel = '正在准备' + label + '…'; updateLoading(); },
      gamePresented() {
        if (awaitingPresentation && !pendingAssets.size) {
          awaitingPresentation = false; loadingLabel = '';
          updateLoading();
        }
      },
      gameReady(width, height) {
        gameWidth = width; gameHeight = height;
        ready = true;
        overlay.classList.add('hidden');
        document.body.classList.add('ready');
        Module.gamePresented();
        resize();
        canvas.focus();
      },
      inputText(initial) {
        Module.ccall('web_clear_keys',null,[],[]);
        return new Promise(resolve => {
          let composing = false, compositionEnded = -Infinity, finished = false;
          const listeners = new AbortController();
          nameInput.value = initial;
          function finish(value) {
            if (finished) return;
            finished = true;
            listeners.abort();
            nameDialog.close(); resize(); canvas.focus(); resolve(value);
          }
          nameInput.addEventListener('compositionstart',() => { composing = true; },{signal:listeners.signal});
          nameInput.addEventListener('compositionend',() => { composing = false; compositionEnded = performance.now(); },{signal:listeners.signal});
          nameInput.onkeydown = event => {
            if (event.key === 'Enter') {
              suppressedKeyUps.add(event.code);
              if (event.isComposing || composing || event.keyCode === 229 || performance.now() - compositionEnded < 50) event.preventDefault();
            }
          };
          document.getElementById('name-form').onsubmit = event => {
            event.preventDefault();
            if (!composing) finish(nameInput.value);
          };
          document.getElementById('name-cancel').onclick = () => finish(null);
          nameDialog.oncancel = event => { event.preventDefault(); suppressedKeyUps.add('Escape'); finish(null); };
          nameDialog.showModal(); nameInput.focus(); nameInput.select();
        });
      },
      async fetchResponse(url, expected = 0, foreground = true) {
        const transfer = {loaded:0,total:expected,done:false,foreground};
        transfers.set(url, transfer);
        updateLoading();
        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error('资源下载失败');
          transfer.total = expected || Number(response.headers.get('content-length')) || 0;
          const stream = response.body.pipeThrough(new TransformStream({
            transform(chunk, controller) { transfer.loaded += chunk.length; updateLoading(); controller.enqueue(chunk); },
            flush() { transfer.total = transfer.loaded; transfer.done = true; updateLoading(); }
          }));
          return new Response(stream,{headers:response.headers});
        } catch (error) { fail(error); throw error; }
      },
      async fetchBinary(url, expected = 0, foreground = true) {
        return (await Module.fetchResponse(url, expected, foreground)).arrayBuffer();
      },
      instantiateWasm(imports, success) {
        (async () => {
          const response = await Module.fetchResponse('kys-dragon.wasm.gz');
          const stream = response.body.pipeThrough(new DecompressionStream('gzip'));
          const result = await WebAssembly.instantiateStreaming(new Response(stream,{headers:{'Content-Type':'application/wasm'}}),imports);
          success(result.instance,result.module);
        })().catch(fail);
        return {};
      }
    };

    function updateLoading() {
      if (failed) return;
      const active = [...transfers.values()].filter(t=>t.foreground && !t.done);
      const all = [...transfers.values()].filter(t=>t.foreground);
      const loaded = all.reduce((sum,t)=>sum+t.loaded,0), total = all.reduce((sum,t)=>sum+t.total,0);
      document.getElementById('progress').value = total ? loaded / total : 0;
      const progress = (loaded / 1048576).toFixed(1) + ' / ' + (Math.max(total,loaded) / 1048576).toFixed(1) + ' MB';
      if (!ready) statusEl.textContent = '正在加载游戏 · ' + progress;
      else {
        const hidden = !awaitingPresentation && !pendingAssets.size && !active.length;
        if (busy.hidden !== hidden) busy.hidden = hidden;
        const current = active.reduce((sum,t)=>sum+t.loaded,0), size = active.reduce((sum,t)=>sum+t.total,0);
        const text = (loadingLabel || '正在加载资源…') + (active.length && size ? ' ' + (current / 1048576).toFixed(1) + ' / ' + (size / 1048576).toFixed(1) + ' MB' : '');
        if (busy.textContent !== text) busy.textContent = text;
      }
    }

    Module.assetManifest = fetch('assets/manifest.json',{cache:'no-cache'}).then(response=>{
      if (!response.ok) throw new Error('无法读取游戏资源目录');
      return response.json();
    });
    Module.startupPacks = new Map();
    Module.assetManifest.then(manifest=>{
      for (const name of manifest.startup) {
        const promise = Module.fetchBinary('assets/'+name,manifest.sizes[name]);
        promise.catch(fail);
        Module.startupPacks.set(name,promise);
      }
    }).catch(fail);

    for (const type of ['keydown','pointerdown','touchstart']) addEventListener(type,()=>{ Module.hasInteracted = true; },{once:true,capture:true});

    resize();
    addEventListener('resize', resize);
    window.visualViewport?.addEventListener('resize', resize);
    document.addEventListener('fullscreenchange', resize);
    document.getElementById('retry').onclick = () => location.reload();
    document.getElementById('fullscreen').onclick = async event => {
      event.stopPropagation();
      Module.ccall('web_clear_keys',null,[],[]);
      if (mobile) {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else { await document.documentElement.requestFullscreen(); await screen.orientation?.lock?.('landscape').catch(()=>{}); }
        } catch (_) { expanded = !expanded; }
      } else expanded = !expanded;
      resize(); canvas.focus();
    };
    document.getElementById('back').onclick = event => { event.preventDefault(); Module.ccall('web_back',null,[],[]); canvas.focus(); };
    document.getElementById('menu').onclick = () => { Module.ccall('web_clear_keys',null,[],[]); document.getElementById('message').textContent = ''; settings.showModal(); };
    function closeSettings() { settings.close(); canvas.focus(); }
    document.getElementById('close').onclick = closeSettings;
    settings.addEventListener('close',()=>canvas.focus());
    settings.addEventListener('cancel',event=>{ event.preventDefault(); suppressedKeyUps.add('Escape'); closeSettings(); });
    for (const element of [settings,nameDialog,document.getElementById('toolbar')]) {
      for (const type of ['keydown','keyup','keypress','pointerdown','pointerup','mousedown','mouseup','mousemove','click','dblclick','touchstart','touchend','touchmove','wheel']) element.addEventListener(type,event=>event.stopPropagation());
    }
    addEventListener('keyup',event=>{
      if (suppressedKeyUps.delete(event.code)) { event.preventDefault(); event.stopImmediatePropagation(); }
    },true);
    addEventListener('blur',()=>{ if (ready) Module.ccall('web_clear_keys',null,[],[]); });
    canvas.addEventListener('contextmenu',event=>event.preventDefault());
    canvas.addEventListener('pointerdown',()=>canvas.focus());

    const sync = () => new Promise((resolve,reject)=>Module.FS.syncfs(false,error=>error?reject(error):resolve()));
    document.getElementById('export').onclick = async () => {
      try {
        await sync();
        const files = {};
        for (const name of Module.FS.readdir('/persist')) {
          if (/^[rsd](?:[1-9]|1\d|20)\.grp$/.test(name)) {
            const bytes = Module.FS.readFile('/persist/' + name);
            let text = ''; for (let offset=0;offset<bytes.length;offset+=32768) text += String.fromCharCode(...bytes.subarray(offset,offset+32768));
            files[name] = btoa(text);
          }
        }
        if (!Object.keys(files).length) throw new Error('还没有可以导出的存档。');
        const url = URL.createObjectURL(new Blob([JSON.stringify({game:'kys-dragon',version:1,files})],{type:'application/json'}));
        const link = document.createElement('a'); link.href=url; link.download='苍龙逐日存档.json'; link.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
      } catch (error) { document.getElementById('message').textContent = error.message; }
    };
    document.getElementById('import').onclick = () => document.getElementById('save-file').click();
    document.getElementById('save-file').onchange = async event => {
      try {
        const file = event.target.files[0]; if (!file) return;
        const manifest = await Module.assetManifest;
        const sizes = Object.fromEntries([['r','ranger'],['s','allsin'],['d','alldef']].map(([prefix,name])=>[prefix,manifest.files['/game/save/'+name+'.grp'][1]]));
        const maxSize = 1024 + 20 * Object.values(sizes).reduce((total,size)=>total + 4 * Math.ceil(size / 3) + 32,0);
        if (file.size > maxSize) throw new Error('存档文件过大。');
        const save = JSON.parse(await file.text());
        if (save.game !== 'kys-dragon' || save.version !== 1 || !save.files || typeof save.files !== 'object') throw new Error('不是有效的苍龙逐日存档。');
        const files = Object.entries(save.files).map(([name,text])=>{
          if (!/^[rsd](?:[1-9]|1\d|20)\.grp$/.test(name) || typeof text !== 'string') throw new Error('存档内容不正确。');
          const bytes = Uint8Array.from(atob(text),c=>c.charCodeAt(0));
          if (bytes.length !== sizes[name[0]]) throw new Error('存档数据长度不正确：'+name);
          for (const prefix of ['r','s','d']) {
            if (!Object.hasOwn(save.files,prefix+name.slice(1))) throw new Error('存档缺少配套文件：'+name.slice(1));
          }
          return [name,bytes];
        });
        if (!files.length) throw new Error('存档为空。');
        for (const [name,bytes] of files) Module.FS.writeFile('/persist/'+name,bytes);
        await sync(); document.getElementById('message').textContent = '导入完成，请从游戏菜单读取存档。';
      } catch (error) { document.getElementById('message').textContent = error.message; }
      event.target.value = '';
    };

    if (!window.DecompressionStream || !window.WebAssembly) fail(new Error('请使用较新的浏览器。'));
    else { const script=document.createElement('script'); script.src='kys-dragon.js'; script.onerror=()=>fail(new Error('游戏程序下载失败。')); document.body.appendChild(script); }
  </script>
</body>
</html>
